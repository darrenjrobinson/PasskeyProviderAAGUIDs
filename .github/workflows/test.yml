name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwsh:
    name: PowerShell 7 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Pester
        run: |
          if (-not (Get-Module -Name Pester -ListAvailable | Where-Object Version -ge '5.5.0')) {
            Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Test repository
        run: ./tests/Invoke-Tests.ps1 -OutputPath test-results-repo.xml

      - name: Test module package
        run: |
          $package = ./build/New-ModulePackage.ps1 -Destination $env:RUNNER_TEMP
          ./tests/Invoke-Tests.ps1 -Path $package -OutputPath test-results-package.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-pwsh-${{ matrix.os }}
          path: test-results-*.xml
          if-no-files-found: ignore

  windows-powershell:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Pester
        run: |
          if (-not (Get-Module -Name Pester -ListAvailable | Where-Object Version -ge '5.5.0')) {
            Install-Module -Name Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }

      # The Build suite needs PowerShell 7, so this runs the Data and Module suites against the repo and the package
      - name: Test repository and module package
        run: |
          ./tests/Invoke-Tests.ps1 -Suite Data, Module -OutputPath test-results-repo.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = ./build/New-ModulePackage.ps1 -Destination $env:RUNNER_TEMP
          ./tests/Invoke-Tests.ps1 -Path $package -OutputPath test-results-package.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows-powershell
          path: test-results-*.xml
          if-no-files-found: ignore
